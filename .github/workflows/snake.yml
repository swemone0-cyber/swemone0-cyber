name: Generate Pink Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: swemone0-cyber
          outputs: |
            dist/pink-snake.svg?palette=github-dark&color_snake=#FF8FB1&color_dots=F5E6FA,D9BFEA,C9A9E0,B497D6,9B6FC4

      - name: Turn contribution squares into hearts
        run: |
          python3 - <<'PY'
          import re

          path = "dist/pink-snake.svg"
          with open(path, "r", encoding="utf-8") as f:
              svg = f.read()

          heart_clip = (
              '<defs><clipPath id="heart-cell" clipPathUnits="objectBoundingBox">'
              '<path d="M0.5,0.15 C0.35,0 0,0.1 0,0.35 '
              'C0,0.55 0.25,0.75 0.5,0.95 '
              'C0.75,0.75 1,0.55 1,0.35 '
              'C1,0.1 0.65,0 0.5,0.15 Z"/>'
              '</clipPath></defs>'
          )
          svg = re.sub(r'(<svg[^>]*>)', r'\1' + heart_clip, svg, count=1)
          svg = svg.replace('</style>', '.c,.s{clip-path:url(#heart-cell);}</style>', 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
